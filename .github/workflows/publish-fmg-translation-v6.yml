name: Publish FMGWorld translation fix 6
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-fmg-translation-v6.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-fmgworld-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Reconstruct validated signed patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          inputs = {"patch.b64": "", "merge.py": "", "update.json": "", "update-old.json": "", "catalog.json": ""}
          for name,data in inputs.items(): Path(name).write_bytes(base64.b64decode(data))
          PY
          mkdir base
          gh release download fmgworld-patch-v5 --pattern payload.zip --pattern payload-old.zip --dir base
          python3 merge.py base/payload.zip payload.zip patch.b64
          python3 merge.py base/payload-old.zip payload-old.zip patch.b64
          python3 - <<'PY'
          import base64,json,hashlib,zipfile
          from pathlib import Path
          originals=set()
          for manifest,payload in [('update.json','payload.zip'),('update-old.json','payload-old.zip')]:
              data=json.loads(base64.b64decode(json.loads(Path(manifest).read_text())['signed_data']))
              assert data['version']==6 and data['game']=='fmgworld'
              originals.add(data['source_sha256'])
              blob=Path(payload).read_bytes()
              assert len(blob)==data['patch_size'] and hashlib.sha256(blob).hexdigest()==data['patch_sha256']
              with zipfile.ZipFile(payload) as z:
                  assert 'assets/x-game/x-zzzzz_fmg_translation_v6.rpyc' in z.namelist()
          cat=json.loads(base64.b64decode(json.loads(Path('catalog.json').read_text())['signed_data']))
          assert cat['catalog_version']==3 and len(cat['versions'])==2 and len(originals)==2
          assert {json.loads(base64.b64decode(v['release']['signed_data']))['source_sha256'] for v in cat['versions']}==originals
          assert all(json.loads(base64.b64decode(v['release']['signed_data']))['version']==6 for v in cat['versions'])
          PY
      - name: Publish complete attachments before activating catalogue
        shell: bash
        run: |
          set -euo pipefail
          tag=fmgworld-patch-v6
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" payload.zip payload-old.zip update.json update-old.json --draft --title 'FMGWorld 汉化修复6 · 技能状态补译与错译修正' --notes '补齐15个技能名称和6个状态名称，统一相关人名与任务地点译法，修正简单难度标题误译。分别适配两个官方0.2.1构建，保留修复5的百分号修正及原游戏逻辑。已通过31项引擎检查；未完成实体手机全剧情验证。下载补丁后重新生成中文版并覆盖安装，建议先备份存档。'
          else
            gh release upload "$tag" payload.zip payload-old.zip update.json update-old.json --clobber
          fi
          gh release edit "$tag" --draft=false --latest
          mkdir verify
          gh release download "$tag" --pattern payload.zip --pattern payload-old.zip --pattern update.json --pattern update-old.json --dir verify
          for file in payload.zip payload-old.zip update.json update-old.json; do cmp "$file" "verify/$file"; done
      - name: Activate signed two-version catalogue
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/catalogs/fmgworld.json" --jq .sha)
          python3 - "$sha" <<'PY'
          import json,base64,sys
          from pathlib import Path
          Path('catalog-request.json').write_text(json.dumps({'message':'Activate FMGWorld translation fix 6 for both original builds','branch':'main','sha':sys.argv[1],'content':base64.b64encode(Path('catalog.json').read_bytes()).decode()}))
          PY
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/catalogs/fmgworld.json" --input catalog-request.json >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/contents/catalogs/fmgworld.json" --jq .content | base64 --decode > catalog-online.json
          cmp catalog.json catalog-online.json
      - name: Advance legacy channel retaining previous manifest
        shell: bash
        run: |
          set -euo pipefail
          channel=fmgworld-test-v3
          mkdir previous
          if gh release download "$channel" --pattern update.json --dir previous; then
            if cmp -s update.json previous/update.json; then exit 0; fi
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$channel" --jq '.assets[] | select(.name=="update.json") | .id')
            test -n "$id"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="update-before-v6-$id.json" >/dev/null
          fi
          gh release upload "$channel" update.json
          gh release edit "$channel" --title 'FMGWorld 更新通道 · 汉化修复6'