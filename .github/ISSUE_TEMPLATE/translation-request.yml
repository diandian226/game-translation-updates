name: 提交我想要汉化的游戏
description: 填写游戏名称和资源地址，有附件就上传，没有就留空。
title: "[汉化申请] "
body:
  - type: input
    id: game_name
    attributes:
      label: 游戏名称
      placeholder: 填写想要汉化的游戏名称
    validations:
      required: true
  - type: input
    id: resource_url
    attributes:
      label: 资源地址
      description: 有链接就填写；如果直接上传附件，没有链接也可以留空。
      placeholder: 粘贴游戏官网、下载页或网盘链接
  - type: textarea
    id: attachments
    attributes:
      label: 上传附件（可选）
      description: 点击输入框的附件按钮选择文件，或拖入文件；没有附件直接提交。安装包请先压缩成ZIP，单个附件不超过25MB，更大的文件请在上面填写网盘链接。
      placeholder: 有安装包或压缩包就上传，没有可留空
    validations:
      required: false
